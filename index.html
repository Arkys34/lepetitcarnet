nav a,nav .tab{flex:none;display:flex;align-items:center;gap:8px;padding:16px 14px 14px;color:var(--mute);text-decoration:none;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
nav [data-k]:not([data-k=home])::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}
nav button.tab{font:inherit;background:none;border-width:0 0 2px;border-style:solid;border-color:transparent;cursor:pointer}
nav .tab::after{content:'';width:5px;height:5px;margin:-3px 0 0 2px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
nav a:hover,nav .tab:hover{color:var(--ink)}
nav [data-k].on{color:var(--ink);border-bottom-color:var(--c)}
#menu{position:fixed;z-index:20;min-width:190px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -16px rgba(43,35,29,.45);font:15px var(--ui)}
#menu[hidden]{display:none}
#menu a{display:block;padding:9px 14px;border-radius:9px;color:var(--ink);text-decoration:none}
#menu a:hover,#menu a.on{background:#f3eadb}
#menu a.on{box-shadow:inset 3px 0 0 var(--c)}
#cog{background:none;border:0;color:var(--mute);font-size:19px;cursor:pointer;padding:8px}
#cog:hover{color:var(--ink)}
main{max-width:980px;margin:28px auto 60px;padding:40px 30px 70px;background:rgba(252,246,236,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(228,220,205,.8);border-radius:22px}
h1,h2,h3{font-family:var(--disp);font-weight:500;line-height:1.2;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(32px,5vw,46px);margin:.1em 0 .6em}
.toolbar{display:flex;gap:12px;margin-bottom:34px;font-family:var(--ui)}
input,select,textarea{font:16px var(--ui);width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink)}
#q{border-radius:999px;padding:11px 20px}
textarea{resize:vertical;font:17px/1.6 'Newsreader',Georgia,serif}
.btn{font:500 14px var(--ui);background:var(--ink);color:#fbf5e9;border:1px solid var(--ink);border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.alt{background:transparent;color:var(--ink)}
.btn.del{background:#9c4a3c;border-color:#9c4a3c}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 56px}
.card{display:block;color:inherit;text-decoration:none;padding-top:18px;border-top:2px solid var(--c)}
.lab{font:500 14px var(--ui);color:var(--c);text-decoration:none}
.card h2{font-size:28px;margin:6px 0 8px;transition:color .15s}
.card:hover h2{color:var(--c)}
.ex{color:#5b4f44;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font:14px var(--ui);color:var(--mute);margin:0}
.st{color:#c58a2b;letter-spacing:1px}
article{max-width:680px;margin:0 auto}
article h1{font-size:clamp(34px,6vw,54px);margin:.2em 0 .3em}
article .meta{padding-bottom:22px;border-bottom:1px solid var(--line)}
.facts{font:15px/1.8 var(--ui);color:#5b4f44;margin:24px 0;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.facts b{color:var(--ink);font-weight:500}
article h3{font-size:22px;margin:28px 0 8px}
.bd{margin-top:26px}
.bd h2{font-size:30px;margin:1.6em 0 .4em}
.bd h3{margin-top:1.4em}
.bd p{margin:0 0 1.1em}
.bd a{color:var(--c)}
.bd img,article img{max-width:100%;border-radius:12px}
blockquote{border-left:2px solid var(--c);margin:1.4em 0;padding-left:18px;color:#5b4f44;font-style:italic}
.tag{font:14px var(--ui);color:var(--mute);text-decoration:none;margin-right:14px}
.tag:hover{color:var(--ink)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.nt{width:100%;min-width:780px;border-collapse:collapse;font:15px var(--ui)}
.nt th,.nt td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.nt th{font-weight:500;color:var(--mute);background:#f6efe2;white-space:nowrap}
.nt tbody tr:last-child td{border-bottom:0}
.nt tbody tr:not(.ed):hover{background:#fbf5e8}
.nt td:first-child{font:500 17px var(--disp)}
.sh{all:unset;cursor:pointer}
.sh:hover{color:var(--ink)}
.nt input,.nt select{padding:7px 10px;font-size:14px;border-radius:8px}
.nt .ed td{background:#fbf5e8}
.nt .ac{white-space:nowrap;text-align:right;width:1%}
.nt input[type=checkbox]{width:18px;height:18px;margin:0;padding:0;accent-color:var(--c)}
.ck{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--c);padding:0 4px}
.ib{background:none;border:0;cursor:pointer;color:var(--mute);font-size:16px;padding:4px 8px;border-radius:6px}
.ib:hover{background:#efe6d3;color:var(--ink)}
.dice{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:0 0 26px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.dbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;font-size:16px}
.dbtn svg{width:26px;height:26px}
.rolling svg{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.res{margin:0;flex:1;min-width:220px;font:15px/1.5 var(--ui);color:var(--mute)}
.res b{display:block;font:500 26px/1.25 var(--disp);color:var(--ink)}
.actions{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
label{display:block;margin-bottom:16px;font:500 14px var(--ui);color:var(--mute)}
label input,label select,label textarea{margin-top:6px}
#f{max-width:720px;margin:0 auto}
#f h1{margin-bottom:.5em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{grid-column:1/-1;text-align:center;font-style:italic;padding:48px 0;color:var(--mute)}
#items:not(.grid)>*{max-width:700px;margin-left:auto;margin-right:auto}
.intro{min-height:160px;font-size:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fbf5e9;font:14px var(--ui);padding:11px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);padding:28px;width:min(92vw,480px);box-shadow:0 24px 60px -20px rgba(43,35,29,.5)}
dialog::backdrop{background:rgba(43,35,29,.5)}
dialog h2{margin-bottom:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:700px){main{margin:16px 10px 40px;padding:28px 16px 50px;border-radius:16px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.toolbar{flex-direction:column}nav a,nav .tab{padding:14px 10px 12px}header{padding:0 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.rolling svg{animation:none}}
</style>
</head>

<nav id="nav" aria-label="Catégories"></nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Pour ajouter une catégorie : une ligne ici. Types de champs : text, area, rate */
const tb=(n,a,b)=>[['nom',n,'text'],['annee','Année','year'],a,b,['note','Note','rate'],['reco','Recommandé par','pick']];
const AR={id:'articles',label:'Articles'};
/* Sous-catégories : t = colonnes du tableau (sinon liste d'articles). Modifiable ici. */
const CATS={
 cinema:{label:'Cinéma',color:'#9c4a3c',fields:[['note','Note sur 5','rate'],['realisation','Réalisation','text']],subs:[{id:'notes',label:'Notes',t:tb('Film',['duree','Durée','text'],['real','Réalisateur','text'])},AR,{id:'pot',label:'Le pot',dice:true,t:[['nom','Film','text'],['annee','Année','year'],['real','Réalisateur','text'],['reco','Proposé par','pick']]}]},
 jeux:{label:'Jeux vidéo',color:'#4a6a8a',fields:[['note','Note sur 5','rate'],['plateforme','Plateforme','text']],subs:[{id:'notes',label:'Notes',t:tb('Jeu',['plateforme','Plateforme','text'],['studio','Studio','text'])},{id:'demos',label:'Démos',t:[['nom','Jeu','text'],['genre','Catégorie','text'],['plateforme','Plateforme','text'],['sortie','Date de sortie','date'],['reco','Proposé par','pick'],['teste','Démo testée','check'],['achat','À acheter','check'],['achete','Acheté','check'],['note','Note','rate'],['avis','Impressions','text']]},AR]},
 cuisine:{label:'Cuisine',color:'#5f7a52',fields:[['personnes','Nombre de personnes','text'],['budget','Budget','text'],['preparation','Temps de préparation','text'],['cuisson','Temps de cuisson','text'],['ingredients','Ingrédients (un par ligne)','area']],subs:[{id:'recettes',label:'Recettes'},{id:'dietetique',label:'Diététique'}]},
 voyages:{label:'Voyages',color:'#b0833a',fields:[['lieu','Destination','text'],['dates','Dates','text']],subs:[{id:'escapades',label:'Escapades'},{id:'notes',label:'Notes',t:tb('Destination',['pays','Pays','text'],['duree','Durée du séjour','text'])}]},
 pop:{label:'Pop culture',color:'#6d5a8a',fields:[['note','Note sur 5','rate']],subs:[{id:'notes',label:'Notes',t:tb('Titre',['type','Type','text'],['createur','Créateur','text'])},AR]}
};
const artSubs=k=>CATS[k].subs.filter(x=>!x.t);
const subOf=a=>{const l=artSubs(a.cat);return l.some(x=>x.id==a.sub)?a.sub:l[0].id};
const FILE='data/articles.json',HOME='data/accueil.json',NOTES='data/notes.json';
let cfg={};try{cfg=JSON.parse(localStorage.getItem('carnet')||'{}')}catch(e){}
const loc=location.hostname.endsWith('github.io')?{owner:location.hostname.split('.')[0],repo:location.pathname.split('/')[1]||location.hostname}:{};
const conf=()=>({branch:'main',...loc,...cfg});
const can=()=>!!conf().token;
let list=[],notes=[],home='',q='';
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const fd=d=>d?new Date(d+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const stars=n=>{n=+n||0;return '★'.repeat(Math.floor(n))+(n%1?'½':'')+'☆'.repeat(5-Math.ceil(n))};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3800)}

/* Mini rendu Markdown : ## titres, **gras**, *italique*, - listes, > citations, [lien](url), ![image](url) */
const inl=s=>s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+|[\w\/.-]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const md=t=>esc(t).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';
 if(/^###? /.test(b)){const n=b.startsWith('###')?3:2;return `<h${n}>${inl(b.replace(/^#+ /,''))}</h${n}>`}
 if(/^- /.test(b))return '<ul>'+b.split('\n').map(l=>`<li>${inl(l.replace(/^- /,''))}</li>`).join('')+'</ul>';
 if(/^&gt; /.test(b))return `<blockquote>${inl(b.replace(/^&gt; /gm,'')).replace(/\n/g,'<br>')}</blockquote>`;
 return `<p>${inl(b).replace(/\n/g,'<br>')}</p>`}).join('');

/* Données : fichier data/articles.json dans le dépôt, modifié via l'API GitHub */
async function gh(method,body,f=FILE){const c=conf();
 const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${f}`+(method=='GET'?`?ref=${c.branch}&t=${Date.now()}`:''),{method,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
 if(!r.ok){if(r.status==404&&method=='GET')return null}
 if(!r.ok)throw new Error(r.status==401?'Token refusé : vérifie-le dans les réglages.':r.status==403?'Token sans droit d’écriture sur ce dépôt.':r.status==404?'Dépôt ou fichier introuvable : vérifie les réglages.':'GitHub a répondu '+r.status);
 return r.json()}
async function rd(f,d){try{if(can()){const j=await gh('GET',null,f);return j?JSON.parse(unb64(j.content)):d}const r=await fetch(f+'?t='+Date.now());return r.ok?await r.json():d}catch(e){if(can())toast(e.message);try{const r=await fetch(f);if(r.ok)return await r.json()}catch(_){}return d}}
async function load(){list=await rd(FILE,[]);notes=await rd(NOTES,[]);home=(await rd(HOME,{})).content||'';route()}
async function commit(fn,msg,f=FILE,d=[]){const j=await gh('GET',null,f);const l=fn(j?JSON.parse(unb64(j.content)):d);
 await gh('PUT',{message:msg,content:b64(JSON.stringify(l,null,1)),...(j?{sha:j.sha}:{}),branch:conf().branch},f);if(f==FILE)list=l;if(f==NOTES)notes=l}

/* Vues */
const card=a=>{const c=CATS[a.cat]||CATS.pop;const n=a.extra&&a.extra.note;
 return `<a class="card" href="#/a/${a.id}" style="--c:${c.color}"><span class="lab" style="--c:${c.color}">${c.label}</span><h2>${esc(a.title)}</h2><p class="ex">${esc((a.content||'').replace(/[#>*_`]/g,''))}</p><p class="meta">par ${esc(a.author)}, le ${fd(a.date)}${n?` &nbsp; <span class="st">${stars(n)}</span>`:''}</p></a>`};

function listView(k,sb){const c=CATS[k];
 $('#app').innerHTML=`<div class="toolbar"><input id="q" type="search" placeholder="Chercher un titre, un mot, un tag" value="${esc(q)}" aria-label="Rechercher">${can()?`<a class="btn" href="#/new/${k}/${sb.id}">Écrire un article</a>`:''}</div><span class="lab" style="--c:${c.color}">${c.label}</span><h1>${sb.label}</h1><div id="items" class="grid"></div>`;
 const draw=()=>{const s=q.toLowerCase();
  const r=list.filter(a=>a.cat==k&&subOf(a)==sb.id&&(!s||JSON.stringify(a).toLowerCase().includes(s))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id));
  $('#items').innerHTML=r.length?r.map(card).join(''):`<p class="empty">${s?'Rien ne correspond à cette recherche.':'Aucun article ici pour le moment.'}${can()&&!s?' Lance-toi avec « Écrire un article ».':''}</p>`};
 $('#q').oninput=e=>{q=e.target.value;draw()};draw()}

const byDate=(a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id);
function homeView(){let ed=false;
 $('#app').innerHTML=`<div class="toolbar"><input id="q" type="search" placeholder="Chercher un titre, un mot, un tag" value="${esc(q)}" aria-label="Rechercher">${can()?'<a class="btn" href="#/new/cinema">Écrire un article</a>':''}</div><div id="items"></div>`;
 const draw=()=>{const s=q.toLowerCase(),box=$('#items');box.className=s?'grid':'';
  if(s){const r=list.filter(a=>JSON.stringify(a).toLowerCase().includes(s)).sort(byDate);box.innerHTML=r.length?r.map(card).join(''):'<p class="empty">Rien ne correspond à cette recherche.</p>';return}
  if(ed){box.innerHTML=`<label>Présentation du site<textarea id="ht" rows="14">${esc(home)}</textarea></label><p class="meta">Même mise en forme que les articles : ## Titre, **gras**, *italique*, - liste, [texte](lien), ![image](lien).</p><p><button class="btn" id="hs">Enregistrer</button> <button class="btn alt" id="hc">Annuler</button></p>`;
   $('#hc').onclick=()=>{ed=false;draw()};
   $('#hs').onclick=async e=>{e.target.disabled=true;const v=$('#ht').value;try{await commit(()=>({content:v}),'Modifier la présentation',HOME,{});home=v;ed=false;toast('Enregistré');draw()}catch(err){toast(err.message);e.target.disabled=false}};return}
  box.innerHTML=`<div class="intro">${md(home)}</div>`+(can()?`<p class="actions"><button class="btn alt" id="eh">${home?'Modifier la présentation':'Écrire la présentation'}</button></p>`:'');
  const b=$('#eh');if(b)b.onclick=()=>{ed=true;draw()}};
 $('#q').oninput=e=>{q=e.target.value;draw()};draw()}

const DICE='<div class="dice"><button type="button" class="btn dbtn" id="roll"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z"/><path d="M16 8L4 9M16 8l12 1M9 20L4 9M23 20l5-11M9 20l7 10M23 20l-7 10M16 8l7 12H9z"/></svg>Lancer le dé</button><p class="res" id="res" aria-live="polite">Un film tiré au hasard dans le pot.</p></div>';
function tableView(k,sb){const c=CATS[k],cols=sb.t;let sk=null,dir=1,ed=null,fq='';
 $('#app').innerHTML=`<div class="toolbar"><input id="q" type="search" placeholder="Filtrer le tableau" aria-label="Filtrer le tableau"></div><span class="lab" style="--c:${c.color}">${c.label}</span><h1>${sb.label}</h1>${sb.dice?DICE:''}<div class="tw" style="--c:${c.color}"><table class="nt" style="min-width:${cols.length*118+60}px"><thead></thead><tbody></tbody></table></div>`;
 const inp=([key,l,t],v)=>t=='check'?`<input type="checkbox" data-k="${key}" aria-label="${l}" ${v?'checked':''}>`:t=='pick'?`<select data-k="${key}" aria-label="${l}"><option ${v=='Erina'?'selected':''}>Erina</option><option ${v=='Arkys'?'selected':''}>Arkys</option></select>`:`<input data-k="${key}" placeholder="${l}" aria-label="${l}" ${t=='date'?'type="date"':t=='year'?'type="number" min="1850" max="2100"':t=='rate'?'type="number" min="0" max="5" step="0.5"':''} value="${esc(v)}">`;
 const draw=()=>{const s=fq.toLowerCase(),w=cols.length+(can()?1:0);
  let r=notes.filter(x=>x.cat==k&&(x.sub||'notes')==sb.id&&(!s||JSON.stringify(x).toLowerCase().includes(s)));
  if(sk){const t=cols.find(x=>x[0]==sk)[2],nm=t=='year'||t=='rate'||t=='check',nv=v=>t=='check'?(v?1:0):parseFloat(v)||0;r=[...r].sort((a,b)=>(nm?nv(a[sk])-nv(b[sk]):String(a[sk]||'').localeCompare(String(b[sk]||''),'fr'))*dir)}
  $('.nt thead').innerHTML='<tr>'+cols.map(([key,l])=>`<th><button type="button" class="sh" data-a="s" data-id="${key}">${l}${sk==key?(dir>0?' ↑':' ↓'):''}</button></th>`).join('')+(can()?'<th></th>':'')+'</tr>';
  const row=x=>x.id==ed?`<tr class="ed">${cols.map(cl=>`<td>${inp(cl,x[cl[0]]||'')}</td>`).join('')}<td class="ac"><button type="button" class="ib" data-a="ok" data-id="${x.id}" title="Valider">✓</button><button type="button" class="ib" data-a="no" title="Annuler">✕</button></td></tr>`
   :`<tr>${cols.map(([key,l,t])=>`<td>${t=='rate'?(x[key]!==undefined&&x[key]!==''?`<span class="st" title="${esc(x[key])} sur 5">${stars(x[key])}</span>`:''):t=='check'?(can()?`<button type="button" class="ck" data-a="t" data-id="${x.id}" data-f="${key}" aria-label="${l}" aria-pressed="${!!x[key]}">${x[key]?'☑':'☐'}</button>`:x[key]?'✓':''):t=='date'?fd(x[key]):esc(x[key])}</td>`).join('')}${can()?`<td class="ac"><button type="button" class="ib" data-a="e" data-id="${x.id}" title="Modifier">✎</button><button type="button" class="ib" data-a="d" data-id="${x.id}" title="Supprimer">✕</button></td>`:''}</tr>`;
  $('.nt tbody').innerHTML=(r.length?r.map(row).join(''):(can()?'':`<tr><td colspan="${w}" class="empty">${s?'Rien ne correspond à cette recherche.':'Rien pour le moment.'}</td></tr>`))
   +(can()?`<tr class="ed">${cols.map(cl=>`<td>${inp(cl,'')}</td>`).join('')}<td class="ac"><button type="button" class="ib" data-a="add" title="Ajouter">＋</button></td></tr>`:'')};
 const save=async(fn,msg,btn)=>{if(btn)btn.disabled=true;try{await commit(fn,msg,NOTES,[]);ed=null;toast('Enregistré')}catch(e){toast(e.message)}draw()};
 if(sb.dice){const btn=$('#roll'),res=$('#res');
  btn.onclick=()=>{const r=notes.filter(x=>x.cat==k&&(x.sub||'notes')==sb.id);
   if(!r.length){res.textContent='Le pot est vide : ajoutez-y quelques films.';return}
   const pick=r[Math.floor(Math.random()*r.length)];
   const fin=()=>{btn.disabled=false;btn.classList.remove('rolling');res.innerHTML=`Le dé a tranché<b>${esc(pick.nom)}</b>${[pick.annee,pick.real&&'réalisé par '+pick.real,pick.reco&&'proposé par '+pick.reco].filter(Boolean).map(esc).join(', ')}`};
   if(matchMedia('(prefers-reduced-motion:reduce)').matches){fin();return}
   btn.disabled=true;btn.classList.add('rolling');let n=0;
   const iv=setInterval(()=>{if(!$('#res')||++n>14){clearInterval(iv);if($('#res'))fin();return}res.innerHTML=`Le dé roule…<b>${esc(r[Math.floor(Math.random()*r.length)].nom)}</b>`},75)}}
 const tw=$('.tw');
 tw.onclick=e=>{const t=e.target.closest('button');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  if(a=='s'){sk==id?dir=-dir:(sk=id,dir=1);draw()}
  else if(a=='e'){ed=id;draw()}
  else if(a=='t'){save(l=>l.map(x=>x.id==id?{...x,[t.dataset.f]:!x[t.dataset.f]}:x),'Modifier une case',t)}
  else if(a=='no'){ed=null;draw()}
  else if(a=='d'){if(confirm('Supprimer cette ligne ?'))save(l=>l.filter(x=>x.id!=id),'Supprimer une note',t)}
  else{const o={};t.closest('tr').querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.type=='checkbox'?i.checked:i.value.trim());
   if(!o.nom){toast('Le nom est obligatoire.');return}
   if(a=='ok')save(l=>l.map(x=>x.id==id?{...x,...o}:x),'Modifier : '+o.nom,t);
   else save(l=>[...l,{id:Date.now().toString(36),cat:k,sub:sb.id,...o}],'Ajouter : '+o.nom,t)}};
 tw.onkeydown=e=>{if(e.key=='Enter'&&e.target.matches('input')){e.preventDefault();e.target.closest('tr').querySelector('[data-a=ok],[data-a=add]').click()}};
 $('#q').oninput=e=>{fq=e.target.value;draw()};draw()}

function articleView(a){
 if(!a){$('#app').innerHTML='<p class="empty">Cet article n’existe pas (ou plus).</p>';return}
 const c=CATS[a.cat]||CATS.pop,x=a.extra||{};
 const facts=c.fields.filter(([k,,t])=>x[k]&&t=='text').map(([k,l])=>`<b>${l}</b>&nbsp;: ${esc(x[k])}`).join('<br>');
 const ing=c.fields.filter(([k,,t])=>x[k]&&t=='area').map(([k,l])=>`<h3>${l}</h3><ul>${x[k].split('\n').filter(Boolean).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('');
 $('#app').innerHTML=`<article style="--c:${c.color}"><a class="lab" href="#/c/${a.cat}/${subOf(a)}">${c.label}</a><h1>${esc(a.title)}</h1><p class="meta">par ${esc(a.author)}, le ${fd(a.date)}${x.note?` &nbsp; <span class="st" title="${x.note} sur 5">${stars(x.note)}</span>`:''}</p>${facts?`<div class="facts">${facts}</div>`:''}${ing}<div class="bd">${md(a.content)}</div><p>${(a.tags||[]).map(t=>`<a class="tag" href="#/" data-tag="${esc(t)}">#${esc(t)}</a>`).join('')}</p>${can()?`<p class="actions"><a class="btn" href="#/edit/${a.id}">Modifier</a> <button class="btn del" id="del">Supprimer</button></p>`:''}</article>`;
 const d=$('#del');if(d)d.onclick=async()=>{if(!confirm('Supprimer cet article ?'))return;d.disabled=true;
  try{await commit(l=>l.filter(i=>i.id!=a.id),'Supprimer : '+a.title);toast('Supprimé');location.hash='#/c/'+a.cat+'/'+subOf(a)}catch(e){toast(e.message);d.disabled=false}}}

function editor(a,cat,sb){
 if(!can()){$('#app').innerHTML='<p class="empty">Pour écrire, ajoute d’abord ton token GitHub dans les réglages (⚙ en haut à droite).</p>';return}
 if(!a&&location.hash.startsWith('#/edit')){articleView(null);return}
 const e=a?{...a,sub:subOf(a)}:{cat:CATS[cat]?cat:'cinema',sub:sb,author:'Erina',date:new Date().toISOString().slice(0,10),tags:[],extra:{},content:'',title:''};
 const ex=()=>CATS[$('#cat').value].fields.map(([k,l,t])=>{const v=esc(e.extra[k]);return `<label>${l}${t=='area'?`<textarea name="x_${k}" rows="5">${v}</textarea>`:`<input name="x_${k}" ${t=='rate'?'type="number" min="0" max="5" step="0.5"':''} value="${v}">`}</label>`}).join('');
 $('#app').innerHTML=`<h1>${a?'Modifier l’article':'Nouvel article'}</h1><form id="f"><div class="row"><label>Catégorie<select id="cat" name="cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${k==e.cat?'selected':''}>${c.label}</option>`).join('')}</select></label><label>Auteur·rice<select name="author">${['Erina','Arkys'].map(n=>`<option ${n==e.author?'selected':''}>${n}</option>`).join('')}</select></label></div><label>Titre<input name="title" required value="${esc(e.title)}"></label><div class="row"><label>Date<input name="date" type="date" required value="${e.date}"></label><label>Tags (séparés par des virgules)<input name="tags" value="${esc(e.tags.join(', '))}"></label></div><div id="sbw"></div><div id="ex"></div><label>Texte<textarea name="content" rows="16" required>${esc(e.content)}</textarea></label><p class="meta">Mise en forme : ## Titre, **gras**, *italique*, - liste, &gt; citation, [texte](lien), ![image](lien). Une ligne vide sépare les paragraphes.</p><p><button class="btn" id="save">${a?'Enregistrer':'Publier'}</button> <a class="btn alt" href="#/${a?'a/'+a.id:'c/'+e.cat+'/'+subOf(e)}">Annuler</a></p></form>`;
 const ss=()=>{const l=artSubs($('#cat').value);$('#sbw').innerHTML=l.length>1?`<label>Rubrique<select name="sub">${l.map(x=>`<option value="${x.id}" ${x.id==e.sub?'selected':''}>${x.label}</option>`).join('')}</select></label>`:''};
 $('#ex').innerHTML=ex();ss();$('#cat').onchange=()=>{$('#ex').innerHTML=ex();ss()};
 $('#f').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.target),x={};
  CATS[d.get('cat')].fields.forEach(([k])=>{const v=(d.get('x_'+k)||'').trim();if(v)x[k]=v});
  const art={id:e.id||Date.now().toString(36),cat:d.get('cat'),sub:d.get('sub')||artSubs(d.get('cat'))[0].id,title:d.get('title').trim(),author:d.get('author'),date:d.get('date'),tags:d.get('tags').split(',').map(s=>s.trim()).filter(Boolean),extra:x,content:d.get('content')};
  const b=$('#save');b.disabled=true;
  try{await commit(l=>{const i=l.findIndex(o=>o.id==art.id);i<0?l.unshift(art):l[i]=art;return l},(a?'Modifier : ':'Ajouter : ')+art.title);toast(a?'Enregistré':'Publié');location.hash='#/a/'+art.id}
  catch(err){toast(err.message);b.disabled=false}}}

function route(){
 closeMenu();const [,k,a,sb]=(location.hash||'#/').split('/');
 const art=list.find(i=>i.id==a);
 const on=k=='c'||k=='new'?a:k=='a'||k=='edit'?(art||{}).cat:'home';
 document.querySelectorAll('#nav [data-k]').forEach(n=>n.classList.toggle('on',n.dataset.k==on));
 if(k=='c'&&CATS[a]){const x=CATS[a].subs.find(y=>y.id==sb)||CATS[a].subs[0];x.t?tableView(a,x):listView(a,x)}else if(k=='a')articleView(art);else if(k=='new')editor(null,a,sb);else if(k=='edit')editor(art);else homeView();
 scrollTo(0,0)}

/* Réglages */
const openSettings=()=>{const c=conf(),d=$('#dlg');
 d.innerHTML=`<form id="sf"><h2>Réglages</h2><p class="meta">Pour écrire et modifier des articles, colle un token GitHub (fine-grained, avec « Contents : Read and write » sur ce dépôt uniquement). Il reste dans ce navigateur. Sans token, le site est en lecture seule.</p><div class="row"><label>Compte GitHub<input name="owner" value="${esc(c.owner)}"></label><label>Dépôt<input name="repo" value="${esc(c.repo)}"></label></div><div class="row"><label>Branche<input name="branch" value="${esc(c.branch)}"></label><label>Token<input name="token" type="password" autocomplete="off" value="${esc(c.token)}"></label></div><p><button class="btn">Enregistrer</button> <button type="button" class="btn alt" id="out">Se déconnecter</button> <button type="button" class="btn alt" id="x">Fermer</button></p></form>`;
 d.showModal();$('#x').onclick=()=>d.close();
 $('#out').onclick=()=>{delete cfg.token;localStorage.setItem('carnet',JSON.stringify(cfg));d.close();toast('Déconnecté');load()};
 $('#sf').onsubmit=e=>{e.preventDefault();cfg=Object.fromEntries(new FormData(e.target));localStorage.setItem('carnet',JSON.stringify(cfg));d.close();toast('Enregistré');load()}};

$('#nav').innerHTML='<span></span><div class="links"><a data-k="home" href="#/" style="--c:#2b231d">Accueil</a>'+Object.entries(CATS).map(([k,c])=>`<button type="button" class="tab" data-k="${k}" aria-haspopup="true" aria-expanded="false" style="--c:${c.color}">${c.label}</button>`).join('')+'</div><button id="cog" aria-label="Réglages" title="Réglages">⚙</button>';
const menu=document.createElement('div');menu.id='menu';menu.hidden=true;document.body.appendChild(menu);
let openK=null;
function closeMenu(){menu.hidden=true;openK=null;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-expanded','false'))}
function openMenu(b){const k=b.dataset.k,cur=(location.hash||'').split('/');
 menu.innerHTML=CATS[k].subs.map(x=>`<a href="#/c/${k}/${x.id}" class="${cur[2]==k&&(cur[3]||CATS[k].subs[0].id)==x.id&&cur[1]=='c'?'on':''}" style="--c:${CATS[k].color}">${x.label}</a>`).join('');
 menu.hidden=false;const r=b.getBoundingClientRect();menu.style.top=r.bottom+'px';menu.style.left=Math.max(8,Math.min(r.left,innerWidth-menu.offsetWidth-8))+'px';
 b.setAttribute('aria-expanded','true');openK=k}
$('#cog').onclick=openSettings;
$('#nav').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){const same=openK==b.dataset.k;closeMenu();if(!same)openMenu(b);return}if(e.target.closest('a'))q=''});
menu.addEventListener('click',e=>{if(e.target.closest('a')){q='';closeMenu()}});
document.addEventListener('click',e=>{if(!e.target.closest('.tab,#menu'))closeMenu()});
addEventListener('keydown',e=>{if(e.key=='Escape')closeMenu()});
addEventListener('scroll',closeMenu,true);addEventListener('resize',closeMenu);
document.addEventListener('click',e=>{const t=e.target.closest('[data-tag]');if(t)q=t.dataset.tag});
addEventListener('hashchange',route);
load();
</script>
</body>
</html>
