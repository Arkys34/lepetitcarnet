<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le petit Carnet d’Erina et Arkys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1810;--paper:#f0e2c2;--wood:#4a2c17;--lamp:#d98f2b}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper) radial-gradient(circle at 15% 8%,#f8eed6,transparent 60%),radial-gradient(circle at 90% 85%,#e4cc9a,transparent 55%) fixed;font:17px/1.75 'Lora',Georgia,serif}
.banner{display:block;width:100%;height:auto}
nav{background:#e6d2a2;border-top:8px solid var(--wood);border-bottom:2px solid #b89868;padding:0 20px;height:98px;display:flex;gap:12px;align-items:flex-start;overflow-x:auto;overflow-y:hidden}
nav a{flex:none;width:118px;height:60px;padding:10px 8px 0;text-align:center;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent 25%,transparent 75%,rgba(0,0,0,.16)),var(--c);color:#f6e8c8;text-decoration:none;font:400 18px/1.15 'Kaushan Script',cursive;display:flex;justify-content:center;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 14px),0 100%);transition:height .2s}
nav a:hover{height:68px}
nav a.on{height:82px}
#cog{margin-left:auto;flex:none;align-self:center;background:none;border:0;color:var(--wood);font-size:22px;cursor:pointer;padding:4px 8px;opacity:.7}
#cog:hover{opacity:1}
.intro{min-height:160px}
main{max-width:740px;margin:0 auto;padding:32px 20px 80px}
h1,h2,h3{font-family:'Kaushan Script',cursive;font-weight:400;line-height:1.25}
h1{font-size:40px;margin:.2em 0 .5em}
.toolbar{display:flex;gap:10px;margin-bottom:22px}
input,select,textarea{font:inherit;width:100%;background:#fbf3de;border:1.5px solid #b89868;border-radius:4px;padding:8px 10px;color:var(--ink)}
textarea{resize:vertical}
.btn{font:inherit;background:var(--ink);color:#f6e8c8;border:1.5px solid var(--ink);border-radius:4px;padding:8px 16px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block;line-height:1.5}
.btn.alt{background:transparent;color:var(--ink)}
.btn.del{background:#9a2a2a;border-color:#9a2a2a}
.btn:disabled{opacity:.5}
.card{display:block;color:inherit;text-decoration:none;padding:14px 18px 14px 22px;margin-bottom:18px;background:#f8eed4;border-left:10px solid var(--c);border-radius:2px 6px 6px 2px;box-shadow:0 1px 0 #c9ae78,0 2px 6px rgba(74,44,23,.18)}
.card:hover h2{color:var(--c)}
.card h2{margin:0;font-size:26px}
.card p:last-child{margin:0}
.meta{margin:2px 0 8px;font-style:italic;color:#6b4a2c;font-size:15px}
.meta a{color:inherit}
article{border-top:10px solid var(--c);padding-top:10px}
article h1{margin-bottom:.2em}
article img{max-width:100%;border-radius:4px}
article a{color:var(--c)}
.stars{color:var(--lamp);font-size:24px;margin:0}
blockquote{border-left:3px solid var(--lamp);margin:1em 0;padding-left:16px;font-style:italic}
.facts{background:#f8eed4;border-left:4px solid var(--c);padding:8px 16px;margin:16px 0}
.tag{display:inline-block;margin:0 6px 6px 0;padding:0 10px;border:1.5px solid #b89868;border-radius:99px;font-size:14px;text-decoration:none;color:#6b4a2c}
.actions{margin-top:32px}
label{display:block;margin-bottom:14px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{text-align:center;font-style:italic;padding:40px 0;color:#6b4a2c}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#f6e8c8;padding:10px 20px;border-radius:6px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:8px;background:var(--paper);color:var(--ink);padding:22px 26px;width:min(92vw,480px)}
dialog::backdrop{background:rgba(42,24,16,.6)}
dialog h2{margin-top:0}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
@media(max-width:560px){.row{grid-template-columns:1fr}nav a{width:98px;font-size:16px}h1{font-size:32px}.toolbar{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const CATS={
 cinema:{label:'Cinéma',color:'#9a2a2a',fields:[['note','Note sur 5','rate'],['realisation','Réalisation','text']]},
 jeux:{label:'Jeux vidéo',color:'#35567d',fields:[['note','Note sur 5','rate'],['plateforme','Plateforme','text']]},
 cuisine:{label:'Cuisine',color:'#2f6a48',fields:[['temps','Temps et portions','text'],['ingredients','Ingrédients (un par ligne)','area']]},
 voyages:{label:'Voyages',color:'#8a5524',fields:[['lieu','Destination','text'],['dates','Dates','text']]},
 pop:{label:'Pop culture',color:'#1f3a5a',fields:[['note','Note sur 5','rate']]}
};
const FILE='data/articles.json',HOME='data/accueil.json';
let cfg={};try{cfg=JSON.parse(localStorage.getItem('carnet')||'{}')}catch(e){}
const loc=location.hostname.endsWith('github.io')?{owner:location.hostname.split('.')[0],repo:location.pathname.split('/')[1]||location.hostname}:{};
const conf=()=>({branch:'main',...loc,...cfg});
const can=()=>!!conf().token;
let list=[],home='',q='';
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const fd=d=>d?new Date(d+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const stars=n=>{n=+n||0;return '★'.repeat(Math.floor(n))+(n%1?'½':'')+'☆'.repeat(5-Math.ceil(n))};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3800)}

/* Mini rendu Markdown : ## titres, **gras**, *italique*, - listes, > citations, [lien](url), ![image](url) */
const inl=s=>s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+|[\w\/.-]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const md=t=>esc(t).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';
 if(/^###? /.test(b)){const n=b.startsWith('###')?3:2;return `<h${n}>${inl(b.replace(/^#+ /,''))}</h${n}>`}
 if(/^- /.test(b))return '<ul>'+b.split('\n').map(l=>`<li>${inl(l.replace(/^- /,''))}</li>`).join('')+'</ul>';
 if(/^&gt; /.test(b))return `<blockquote>${inl(b.replace(/^&gt; /gm,'')).replace(/\n/g,'<br>')}</blockquote>`;
 return `<p>${inl(b).replace(/\n/g,'<br>')}</p>`}).join('');

/* Données : fichier data/articles.json dans le dépôt, modifié via l'API GitHub */
async function gh(method,body,f=FILE){const c=conf();
 const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${f}`+(method=='GET'?`?ref=${c.branch}&t=${Date.now()}`:''),{method,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
 if(!r.ok){if(r.status==404&&method=='GET')return null}
 if(!r.ok)throw new Error(r.status==401?'Token refusé : vérifie-le dans les réglages.':r.status==403?'Token sans droit d’écriture sur ce dépôt.':r.status==404?'Dépôt ou fichier introuvable : vérifie les réglages.':'GitHub a répondu '+r.status);
 return r.json()}
async function rd(f,d){try{if(can()){const j=await gh('GET',null,f);return j?JSON.parse(unb64(j.content)):d}const r=await fetch(f+'?t='+Date.now());return r.ok?await r.json():d}catch(e){if(can())toast(e.message);try{const r=await fetch(f);if(r.ok)return await r.json()}catch(_){}return d}}
async function load(){list=await rd(FILE,[]);home=(await rd(HOME,{})).content||'';route()}
async function commit(fn,msg,f=FILE,d=[]){const j=await gh('GET',null,f);const l=fn(j?JSON.parse(unb64(j.content)):d);
 await gh('PUT',{message:msg,content:b64(JSON.stringify(l,null,1)),...(j?{sha:j.sha}:{}),branch:conf().branch},f);if(f==FILE)list=l}

/* Vues */
const card=a=>{const c=CATS[a.cat]||CATS.pop;const n=a.extra&&a.extra.note;
 return `<a class="card" href="#/a/${a.id}" style="--c:${c.color}"><h2>${esc(a.title)}</h2><p class="meta">${c.label}, par ${esc(a.author)}, le ${fd(a.date)}${n?'&nbsp; '+stars(n):''}</p><p>${esc((a.content||'').replace(/[#>*_`]/g,'').slice(0,160))}…</p></a>`};

function listView(k){const c=CATS[k];
 $('#app').innerHTML=`<div class="toolbar"><input id="q" type="search" placeholder="Chercher un titre, un mot, un tag" value="${esc(q)}" aria-label="Rechercher">${can()?`<a class="btn" href="#/new/${k||'cinema'}">Écrire un article</a>`:''}</div><h1>${c.label}</h1><div id="items"></div>`;
 const draw=()=>{const s=q.toLowerCase();
  const r=list.filter(a=>(!k||a.cat==k)&&(!s||JSON.stringify(a).toLowerCase().includes(s))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id));
  $('#items').innerHTML=r.length?r.map(card).join(''):`<p class="empty">${s?'Rien ne correspond à cette recherche.':'Aucun article ici pour le moment.'}${can()&&!s?' Lance-toi avec « Écrire un article ».':''}</p>`};
 $('#q').oninput=e=>{q=e.target.value;draw()};draw()}

const byDate=(a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id);
function homeView(){let ed=false;
 $('#app').innerHTML=`<div class="toolbar"><input id="q" type="search" placeholder="Chercher un titre, un mot, un tag" value="${esc(q)}" aria-label="Rechercher">${can()?'<a class="btn" href="#/new/cinema">Écrire un article</a>':''}</div><div id="items"></div>`;
 const draw=()=>{const s=q.toLowerCase(),box=$('#items');
  if(s){const r=list.filter(a=>JSON.stringify(a).toLowerCase().includes(s)).sort(byDate);box.innerHTML=r.length?r.map(card).join(''):'<p class="empty">Rien ne correspond à cette recherche.</p>';return}
  if(ed){box.innerHTML=`<label>Présentation du site<textarea id="ht" rows="14">${esc(home)}</textarea></label><p class="meta">Même mise en forme que les articles : ## Titre, **gras**, *italique*, - liste, [texte](lien), ![image](lien).</p><p><button class="btn" id="hs">Enregistrer</button> <button class="btn alt" id="hc">Annuler</button></p>`;
   $('#hc').onclick=()=>{ed=false;draw()};
   $('#hs').onclick=async e=>{e.target.disabled=true;const v=$('#ht').value;try{await commit(()=>({content:v}),'Modifier la présentation',HOME,{});home=v;ed=false;toast('Enregistré');draw()}catch(err){toast(err.message);e.target.disabled=false}};return}
  box.innerHTML=`<div class="intro">${md(home)}</div>`+(can()?`<p class="actions"><button class="btn alt" id="eh">${home?'Modifier la présentation':'Écrire la présentation'}</button></p>`:'');
  const b=$('#eh');if(b)b.onclick=()=>{ed=true;draw()}};
 $('#q').oninput=e=>{q=e.target.value;draw()};draw()}

function articleView(a){
 if(!a){$('#app').innerHTML='<p class="empty">Cet article n’existe pas (ou plus).</p>';return}
 const c=CATS[a.cat]||CATS.pop,x=a.extra||{};
 const facts=c.fields.filter(([k,,t])=>x[k]&&t=='text').map(([k,l])=>`<b>${l}</b>&nbsp;: ${esc(x[k])}`).join('<br>');
 const ing=c.fields.filter(([k,,t])=>x[k]&&t=='area').map(([k,l])=>`<h3>${l}</h3><ul>${x[k].split('\n').filter(Boolean).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('');
 $('#app').innerHTML=`<article style="--c:${c.color}"><p class="meta"><a href="#/c/${a.cat}">${c.label}</a>, par ${esc(a.author)}, le ${fd(a.date)}</p><h1>${esc(a.title)}</h1>${x.note?`<p class="stars" title="${x.note} sur 5">${stars(x.note)}</p>`:''}${facts?`<div class="facts">${facts}</div>`:''}${ing}<div>${md(a.content)}</div><p>${(a.tags||[]).map(t=>`<a class="tag" href="#/" data-tag="${esc(t)}">#${esc(t)}</a>`).join('')}</p>${can()?`<p class="actions"><a class="btn" href="#/edit/${a.id}">Modifier</a> <button class="btn del" id="del">Supprimer</button></p>`:''}</article>`;
 const d=$('#del');if(d)d.onclick=async()=>{if(!confirm('Supprimer cet article ?'))return;d.disabled=true;
  try{await commit(l=>l.filter(i=>i.id!=a.id),'Supprimer : '+a.title);toast('Supprimé');location.hash='#/c/'+a.cat}catch(e){toast(e.message);d.disabled=false}}}

function editor(a,cat){
 if(!can()){$('#app').innerHTML='<p class="empty">Pour écrire, ajoute d’abord ton token GitHub dans les réglages (⚙ en haut à droite).</p>';return}
 if(!a&&location.hash.startsWith('#/edit')){articleView(null);return}
 const e=a||{cat:CATS[cat]?cat:'cinema',author:'Erina',date:new Date().toISOString().slice(0,10),tags:[],extra:{},content:'',title:''};
 const ex=()=>CATS[$('#cat').value].fields.map(([k,l,t])=>{const v=esc(e.extra[k]);return `<label>${l}${t=='area'?`<textarea name="x_${k}" rows="5">${v}</textarea>`:`<input name="x_${k}" ${t=='rate'?'type="number" min="0" max="5" step="0.5"':''} value="${v}">`}</label>`}).join('');
 $('#app').innerHTML=`<h1>${a?'Modifier l’article':'Nouvel article'}</h1><form id="f"><div class="row"><label>Catégorie<select id="cat" name="cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${k==e.cat?'selected':''}>${c.label}</option>`).join('')}</select></label><label>Auteur·rice<select name="author">${['Erina','Arkys'].map(n=>`<option ${n==e.author?'selected':''}>${n}</option>`).join('')}</select></label></div><label>Titre<input name="title" required value="${esc(e.title)}"></label><div class="row"><label>Date<input name="date" type="date" required value="${e.date}"></label><label>Tags (séparés par des virgules)<input name="tags" value="${esc(e.tags.join(', '))}"></label></div><div id="ex"></div><label>Texte<textarea name="content" rows="16" required>${esc(e.content)}</textarea></label><p class="meta">Mise en forme : ## Titre, **gras**, *italique*, - liste, &gt; citation, [texte](lien), ![image](lien). Une ligne vide sépare les paragraphes.</p><p><button class="btn" id="save">${a?'Enregistrer':'Publier'}</button> <a class="btn alt" href="#/${a?'a/'+a.id:'c/'+e.cat}">Annuler</a></p></form>`;
 $('#ex').innerHTML=ex();$('#cat').onchange=()=>{$('#ex').innerHTML=ex()};
 $('#f').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.target),x={};
  CATS[d.get('cat')].fields.forEach(([k])=>{const v=(d.get('x_'+k)||'').trim();if(v)x[k]=v});
  const art={id:e.id||Date.now().toString(36),cat:d.get('cat'),title:d.get('title').trim(),author:d.get('author'),date:d.get('date'),tags:d.get('tags').split(',').map(s=>s.trim()).filter(Boolean),extra:x,content:d.get('content')};
  const b=$('#save');b.disabled=true;
  try{await commit(l=>{const i=l.findIndex(o=>o.id==art.id);i<0?l.unshift(art):l[i]=art;return l},(a?'Modifier : ':'Ajouter : ')+art.title);toast(a?'Enregistré':'Publié');location.hash='#/a/'+art.id}
  catch(err){toast(err.message);b.disabled=false}}}

function route(){
 const [,k,a]=(location.hash||'#/').split('/');
 const art=list.find(i=>i.id==a);
 const on=k=='c'||k=='new'?a:k=='a'||k=='edit'?(art||{}).cat:'home';
 document.querySelectorAll('#nav a').forEach(n=>n.classList.toggle('on',n.dataset.k==on));
 if(k=='c'&&CATS[a])listView(a);else if(k=='a')articleView(art);else if(k=='new')editor(null,a);else if(k=='edit')editor(art);else homeView();
 scrollTo(0,0)}

/* Réglages */
const openSettings=()=>{const c=conf(),d=$('#dlg');
 d.innerHTML=`<form id="sf"><h2>Réglages</h2><p class="meta">Pour écrire et modifier des articles, colle un token GitHub (fine-grained, avec « Contents : Read and write » sur ce dépôt uniquement). Il reste dans ce navigateur. Sans token, le site est en lecture seule.</p><div class="row"><label>Compte GitHub<input name="owner" value="${esc(c.owner)}"></label><label>Dépôt<input name="repo" value="${esc(c.repo)}"></label></div><div class="row"><label>Branche<input name="branch" value="${esc(c.branch)}"></label><label>Token<input name="token" type="password" autocomplete="off" value="${esc(c.token)}"></label></div><p><button class="btn">Enregistrer</button> <button type="button" class="btn alt" id="out">Se déconnecter</button> <button type="button" class="btn alt" id="x">Fermer</button></p></form>`;
 d.showModal();$('#x').onclick=()=>d.close();
 $('#out').onclick=()=>{delete cfg.token;localStorage.setItem('carnet',JSON.stringify(cfg));d.close();toast('Déconnecté');load()};
 $('#sf').onsubmit=e=>{e.preventDefault();cfg=Object.fromEntries(new FormData(e.target));localStorage.setItem('carnet',JSON.stringify(cfg));d.close();toast('Enregistré');load()}};

$('#nav').innerHTML='<a data-k="home" href="#/" style="--c:#c9a24f;color:#2a1810">Accueil</a>'+Object.entries(CATS).map(([k,c])=>`<a data-k="${k}" href="#/c/${k}" style="--c:${c.color}">${c.label}</a>`).join('')+'<button id="cog" aria-label="Réglages" title="Réglages">⚙</button>';
$('#cog').onclick=openSettings;
$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))q=''});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tag]');if(t)q=t.dataset.tag});
addEventListener('hashchange',route);
load();
</script>
</body>
</html>
